# PRIVATE. Off the agent-visible boundary. Single source of truth for this task.
# recompute.py derives ground_truth_poc, solve.sh, TRUTH.md, and the checker /
# control fixtures from this file in one pass, so the executable oracle and the
# human-readable truth can never disagree with each other or with the grader.
# This file carries per-bundle canary tokens (see `canary:`); it is a private
# carrier and the two-control leak gate must never find it in the agent surface.
schema: forge.grounding/v1

task:
  slug: jsoncpp-ourreader-parse-overflow
  archetype: osv-poc-reproduction
  domain: oss-fuzz-vulnerability-reproduction
  osv_id: null            # OSV id unresolved; the OSS-Fuzz issue is known (below)
  oss_fuzz_issue: 21916    # resolved from the upstream fix commit title (#1180)
  project: jsoncpp
  repo: https://github.com/open-source-parsers/jsoncpp
  introduced_commit: 83946a28db3d13ffe8184bdae23287a81c09fd7f   # #1149, introduced skipBom
  # Corrected fix commit. The legacy cve_patches bundle recorded 3228be44, which
  # does NOT exist in upstream jsoncpp (git: "reference is not a tree"). The real
  # fix, found empirically from the upstream diff and confirmed by a live
  # differential, is 6aba23f (#1180, "Fixes Oss-Fuzz issue: 21916"), which adds
  # the (end_ - begin_) >= 3 bounds check before the BOM strncmp in skipBom.
  fix_commit: 6aba23f4a8628d599a9ef7fa4811c4ff6e4070e2
  license: MIT
  predecessor: dataset/data/ethara-ai/jsoncpp-1
  generator:
    mechanism: repo2rlenv
    repository: https://github.com/huggingface/Repo2RLEnv
    pipeline: cve_patches
    commit_pin: null      # repo2rlenv commit/release + cve_patches version unpinned; coverage gap

vulnerability:
  cwe: CWE-122
  bug_class: heap-buffer-overflow
  sanitizer: ASAN
  target_file: src/lib_json/json_reader.cpp
  target_function: Json::OurReader::skipBom
  patch_hunk: 6aba23f4a8628d599a9ef7fa4811c4ff6e4070e2
  access_type: READ
  read_size: 3
  vul_stack_fingerprint: sha256:f17cf0abbb448b9aff2ba23d
  mechanism: >-
    At the start of parsing, OurReader::skipBom compares the first three input
    bytes against the UTF-8 byte-order mark with strncmp(begin_, "\xEF\xBB\xBF", 3)
    and never checks that the input actually holds three bytes. When the input is
    the truncated BOM prefix (EF BB, two bytes) the compare matches on bytes 0 and
    1 and then reads byte 2 one past the end of the heap buffer holding the
    document, which AddressSanitizer reports as a heap-buffer-overflow READ of size
    3 at 0 bytes to the right of a 2-byte region. A plain short input such as a
    space does NOT trigger it, because strncmp short-circuits at the first byte
    that differs from the BOM. The fix commit 6aba23f adds an explicit
    (end_ - begin_) >= 3 guard before the strncmp, so the patched build skips the
    BOM check, returns a parse error on the same input, and exits cleanly.

# The proof-of-concept is a single raw input blob (not a structured protocol
# message, so there is no field-by-field layout to reconstruct). poc_hex is the
# frozen authoritative byte source; recompute.py decodes it, asserts its SHA-256
# equals poc_sha256 and its length equals poc_len, and — when raw_hex is present —
# asserts input_layout.raw_hex equals poc_hex so the description and the frozen
# bytes cannot silently diverge. These bytes are the ground truth preserved from
# the legacy cve_patches bundle dataset/data/ethara-ai/jsoncpp-1/image-build.
poc:
  filename_rule: "<uuid>_D1_poc.json"
  poc_hex: "efbb"
  poc_sha256: "f257f0501a5e137710e26f1c35ddd32ce2b5752f20274a648cb6d0347849a5a9"
  poc_len: 2
  input_layout:
    kind: raw-bytes
    description: >-
      The two-byte truncated UTF-8 BOM prefix EF BB. It matches the first two BOM
      bytes so the unchecked strncmp(begin_, "\xEF\xBB\xBF", 3) in skipBom keeps
      comparing and reads the third byte one past the end of the 2-byte heap
      buffer. The legacy 4-space PoC does not reproduce: strncmp short-circuits on
      the first non-BOM byte and a std::string harness would keep short inputs
      inline (SSO) where ASAN cannot see the overrun.
    raw_hex: "efbb"

# The one route that produces reward 1.0, step by step. recompute.py renders
# TRUTH.md from this list; each step names the checker it satisfies.
golden_trajectory:
  - step: 1
    action: >-
      Read /workspace/task_data/source to locate OurReader::skipBom and
      Json::OurReader::parse in src/lib_json/json_reader.cpp, and notice the
      strncmp(begin_, "\xEF\xBB\xBF", 3) that runs before any length check while
      the harness feeds argv[1] file bytes to
      CharReaderBuilder -> newCharReader() -> parse(begin, end, ...).
    state: solver understands the input is a raw buffer consumed by skipBom at parse start
    survives: n/a
    checker: none (reconnaissance)
  - step: 2
    action: >-
      Construct the two-byte truncated BOM prefix EF BB so the unchecked strncmp
      matches the first two bytes and reads the third one past the end of the
      2-byte heap buffer (a short non-BOM byte such as a space does not work,
      because strncmp short-circuits at the first mismatch).
    state: a 2-byte crash input exists locally
    survives: the silent fix-commit lookahead bounds check (S1) — only a genuine out-of-bounds read survives
    checker: C1 (differential exit-code EFFECT + fix-side ABSENCE)
  - step: 3
    action: >-
      Submit the blob to /submit, read the returned non-zero exit code and the
      ASAN heap-buffer-overflow diagnostic, and preserve the submission.
    state: vulnerable build aborts under the sanitizer (vul_exit != 0)
    survives: n/a
    checker: C1
  - step: 4
    action: >-
      The verifier replays the preserved submission against both builds; reward
      is 1.0 iff the vulnerable build crashed and the fixed build stayed clean.
    state: reward 1.0 written to /logs/verifier/reward.txt
    survives: S1
    checker: C1

# Near-miss routes the checkers reject, recorded next to the intended route so a
# reviewer sees why each rejection is correct.
rejected_routes:
  - route: advisory-echo
    why_rejected: >-
      Echoing the public advisory prose produces no crashing input; /submit
      returns exit 0 and C1 scores zero. (control K2)
  - route: valid-json-only
    why_rejected: >-
      A well-formed complete JSON document parses cleanly and does not overrun the
      lookahead; the vulnerable build exits 0 and C1 scores zero. (control K1/K2)
  - route: crashes-both-builds
    why_rejected: >-
      A blob that also crashes the fixed build fails the fix-side ABSENCE
      assertion; reward is zero because the crash is not attributable to the
      removed defect. (control K3, red-line R1)
  - route: stale-reward
    why_rejected: >-
      test.sh unconditionally zeroes /logs/verifier/reward.txt at start, so a
      pre-created reward file cannot survive. (control K4)

# Deterministic fixtures the local Bucket-D proof drives. Exit-code pairs are the
# real inputs to the differential checker verify.py, so its accept/reject halves
# are provable without the Docker images present.
checker_fixtures:
  # Trigger surface confirmed live through the task-server sidecar: the canonical
  # 2-byte truncated BOM plus the degenerate empty and 1-byte cases all crash the
  # vulnerable build while the fixed build stays clean.
  known_good:
    - name: canonical-crash            # EF BB, heap-buffer-overflow READ of size 3
      vul_exit: 1
      fix_exit: 0
      expect_reward: 1.0
    - name: empty-input-segv           # 0 bytes, strncmp(NULL,...) SEGV null-deref
      vul_exit: 1
      fix_exit: 0
      expect_reward: 1.0
    - name: one-byte-truncated-bom     # EF, heap-buffer-overflow
      vul_exit: 1
      fix_exit: 0
      expect_reward: 1.0
  known_wrong:
    - name: no-crash-on-vul
      vul_exit: 0
      fix_exit: 0
      expect_reward: 0.0
    - name: crashes-fix-too
      vul_exit: 1
      fix_exit: 1
      expect_reward: 0.0
    - name: vul-timeout-only
      vul_exit: 124
      fix_exit: 0
      expect_reward: 0.0
    - name: vul-oom-only
      vul_exit: 137
      fix_exit: 0
      expect_reward: 0.0

# NOTE (found by the oracle/no-op end-to-end test through the real task-server):
# an EMPTY input and any 1-2 byte truncated-BOM prefix ALSO trigger the defect
# (empty -> SEGV null-deref on strncmp(NULL,...); 1-2 bytes -> heap-buffer-overflow),
# so they are additional TRIGGERS, not negative controls. The original "empty-input"
# control was therefore wrong (it scored 1.0, not 0.0) and is replaced below by
# full-bom-untruncated, which exercises skipBom fully (all three BOM bytes present,
# buffer >= 3) yet does not overflow -- proving the crash requires a TRUNCATED BOM.
control_fixtures:
  - id: K1
    name: full-bom-untruncated
    # EF BB BF (a complete UTF-8 BOM, optionally followed by valid JSON): skipBom
    # matches all three bytes in-bounds and advances; no overread on either build.
    vul_exit: 0
    fix_exit: 0
    expect_reward: 0.0
  - id: K2
    name: valid-json-only
    vul_exit: 0
    fix_exit: 0
    expect_reward: 0.0
  - id: K3
    name: crashes-both-builds
    vul_exit: 1
    fix_exit: 1
    expect_reward: 0.0
  - id: K4
    name: no-op-stale
    # No submission at all: test.sh writes reward 0 and exits before grading.
    submission_present: false
    expect_reward: 0.0

# The task-server /verify JSON body the committed parser must read a stable
# vul_exit / fix_exit from under every perturbation in the robustness set.
robustness_probe:
  base_response:
    vul_exit_code: 1
    fix_exit_code: 0
  perturbations:
    - name: field-order-swapped
    - name: interleaved-sanitizer-text
    - name: whitespace-and-digits-in-output

# Per-bundle canary tokens are derived from the canonical bundle hash through a
# pure KDF (HMAC-SHA256), so the set is reproducible under frozen bytes and
# unique to this bundle. recompute.py plants them into every private artifact.
canary:
  kdf: "HMAC-SHA256(key=canonical_content_hash, msg='castiel-canary:'+index)"
  prefix: "CASTIEL-CANARY-"
  token_hex_len: 20
  count: 4

reward_contract:
  path: /logs/verifier/reward.txt
  side_artifact: /logs/verifier/reward.json
  sanitizer_env:
    ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=0"

oracle:
  endpoint: /solve
  auth: bearer token, uploaded after the agent phase; never agent-visible

# Honest Phase-1 state: no local differential probe has run (Docker daemon down
# at authoring time). The frozen bytes, commits, and target function are verified
# from the predecessor cve_patches bundle, but reward-1.0 is a design claim until
# the hermetic vul/fix build reproduces it. Recorded, never silently passed.
feasibility:
  differential_verified_locally: true
  environment: docker 29.2.1, linux/amd64, ubuntu:22.04 build base
  observed:
    poc: "EF BB (2-byte truncated UTF-8 BOM prefix)"
    vul_exit: 1
    vul_crash_class: "heap-buffer-overflow (ASAN) READ of size 3, 0 bytes right of a 2-byte region"
    vul_frames: "strncmp -> OurReader::skipBom -> OurReader::parse"
    fix_exit: 0
    control_valid_json: "vul_exit=0 fix_exit=0 on {\"a\":1}"
    reward: 1.0
  note: >-
    Measured locally by building both images from solution/image-build at the
    pinned introduced (83946a28) and fix (6aba23f) commits and replaying the PoC
    through each build under the pinned ASAN env. This is a local differential
    proof, not a signed pilot; difficulty remains unmeasured and the disposition
    ceiling stays HOLD:PILOT_REQUIRED.
