services:
  task-server:
    build:
      context: ./task-server
      dockerfile: Dockerfile
    platform: linux/amd64
    expose:
      - "9111"
    environment:
      - AUTH_TOKEN=aa076b043e152581b673889bf64c52e22259abb0e4d13d6262a5739079b3c5e5
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9111/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  main:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - TASK_SERVER=http://task-server:9111
    networks:
      - internal
    depends_on:
      task-server:
        condition: service_healthy
    command: ["sleep", "infinity"]

# Shortcut-resistance modifier M1: an internal-only network. The agent and the
# verifier reach the task-server sidecar and nothing else; there is no external
# egress, so the public advisory and any public PoC are out of reach.
networks:
  internal:
    driver: bridge
    internal: true
